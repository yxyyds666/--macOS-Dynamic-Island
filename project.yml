name: YuLingDongDao
options:
  bundleIdPrefix: com.yuxi
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    COMBINE_HIDPI_IMAGES: YES

targets:
  YuLingDongDao:
    type: application
    platform: macOS
    sources:
      - path: Yu灵动岛
        excludes:
          - "**/.DS_Store"
          # Bundled by build.sh after the Xcode build (the .framework is a
          # directory Xcode would otherwise try to compile as sources).
          - "Resources/MediaRemoteAdapter/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuxi.yulingdongdao
        INFOPLIST_FILE: YuLingDongDao/Info.plist
        PRODUCT_NAME: Yu灵动岛
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: YuLingDongDao/Entitlements.plist
    entitlements:
      path: YuLingDongDao/Entitlements.plist
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.cs.disable-library-validation: true
